# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-intent-graph"
version = "0.1.0"
description = "A typed, provenance-aware computation graph for engineering design."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["pydantic>=2.6,<3", "click>=8.1,<9", "PyYAML>=6,<7", "pint>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2", "build>=1.2,<2", "types-PyYAML>=6,<7", "playwright>=1.45,<2"]
cad = ["cadquery>=2.4,<3"]
pdf = ["playwright>=1.45,<2"]

[project.scripts]
dg = "design_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"design_graph.interchange" = ["assets/graph-viewer.html", "assets/review_template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: tests requiring external solvers or optional heavyweight tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"